<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>동물 달리기 추첨</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Lilita+One&display=swap" rel="stylesheet">
<style>
/* 운동회 그림책: 하늘·언덕·흙길 장면 위에 분홍 테두리 흰 패널, 사탕색 유리알 버튼, 위에서 내려다보는 세로 트랙 */
:root{
  --sky:#4fb0f2; --sky2:#c4e9ff; --grass:#74cc48; --sand:#efcd84; --clay:#e3956b;
  --ink:#24488e; --pink:#ff6f91; --pinkline:#f7a8bc; --blue:#2196e8; --orange:#f5951f; --paper:#ffffff;
  --kfont:'Jua','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
  --dfont:'Lilita One','Jua','Arial Rounded MT Bold',sans-serif;
  color-scheme: light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--kfont);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column}

.topbar{display:flex;align-items:center;gap:10px;padding:8px 16px;background:linear-gradient(#ffffff,#e8f5ff);border-bottom:3px solid var(--pinkline);flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;font-size:22px;color:var(--ink);margin-right:auto;white-space:nowrap}
.logo i{display:inline-block;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 18%,#ffd84a 19% 100%);border:2px solid #e0a020}
.tabs{display:flex;gap:8px}
.tab{font-size:19px;padding:7px 18px;border-radius:999px;border:3px solid #cfe6fb;background:#fff;color:var(--ink)}
.tab[aria-selected="true"]{background:linear-gradient(#64c6ff,#1f8fe0);border-color:#fff;color:#fff;text-shadow:0 2px 0 #1667a8;box-shadow:0 3px 0 #1667a8}
.ibtn{font-size:16px;padding:7px 12px;border-radius:12px;border:2px solid #cfe6fb;background:#fff;color:var(--ink)}
.ibtn[aria-pressed="false"]{opacity:.55}

#stage{position:relative;flex:1;min-height:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}

.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;gap:14px;padding:18px 16px;overflow:auto;box-sizing:border-box}
.panel{background:var(--paper);border:4px solid var(--pinkline);border-radius:24px;box-shadow:0 6px 0 rgba(36,72,142,.10),0 12px 28px rgba(30,60,120,.20);padding:18px 22px;max-width:660px;width:100%;box-sizing:border-box}
.guide{margin:0 0 12px;font-size:19px;line-height:1.55}
.nums{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.num{min-width:40px;height:40px;padding:0 8px;border-radius:9px;border:2px solid #fff;font-size:21px;color:#fff;background:linear-gradient(#ff9a9a,#ef5f6c);box-shadow:0 2px 0 #c8434f,0 0 0 1px #f2a0a6;text-shadow:0 1px 0 #b23a46}
.num.on{background:linear-gradient(#ffc24a,#f58a1f);box-shadow:0 2px 0 #c46510,0 0 0 1px #f5c27a;text-shadow:0 1px 0 #b05a10}
.lbl{display:block;font-size:16px;margin-bottom:6px;color:#5a6ea8}
textarea{width:100%;box-sizing:border-box;min-height:110px;resize:vertical;font-family:var(--kfont);font-size:19px;line-height:1.45;color:var(--ink);border:3px solid #cfe6fb;border-radius:14px;padding:10px 12px;background:#f7fbff}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;font-size:18px}
.seg{display:inline-flex;border:3px solid #cfe6fb;border-radius:999px;overflow:hidden}
.seg button{border:0;background:#fff;color:var(--ink);font-size:18px;padding:6px 16px}
.seg button.on{background:var(--pink);color:#fff}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:17px}
.chk input{width:20px;height:20px;accent-color:var(--pink)}
.count{margin-left:auto;color:#5a6ea8}
.err{color:#d43a5a;font-size:17px;margin:10px 0 0}

.pill{position:relative;font-size:30px;padding:10px 46px 12px;border-radius:999px;border:4px solid #fff;color:#fff;background:linear-gradient(#64c6ff,#1f8fe0);box-shadow:0 5px 0 #1667a8,0 10px 18px rgba(0,0,0,.22);text-shadow:0 2px 0 #1667a8;overflow:hidden}
.pill::before{content:"";position:absolute;left:12%;right:12%;top:4px;height:42%;border-radius:999px;background:rgba(255,255,255,.38)}
.pill.pink{background:linear-gradient(#ff9cc0,#f2557f);box-shadow:0 5px 0 #b9365c,0 10px 18px rgba(0,0,0,.22);text-shadow:0 2px 0 #b9365c}
.pill.white{background:linear-gradient(#fff,#e8f2ff);color:var(--ink);text-shadow:none;border-color:#cfe6fb;box-shadow:0 5px 0 #a9c8e8}
.pill.sm{font-size:21px;padding:8px 26px 10px}
.pill:active{transform:translateY(3px)}

#hud{position:absolute;inset:0;pointer-events:none}
#ticker{position:absolute;left:12px;top:12px;background:rgba(255,255,255,.92);border:3px solid var(--pinkline);border-radius:16px;padding:8px 14px;font-size:18px;line-height:1.5;min-width:150px;max-width:46%}
#ticker b{color:var(--pink)}
#ticker .tt{font-size:14px;color:#5a6ea8}
#ticker div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hudBtns{position:absolute;right:12px;bottom:12px;display:flex;gap:8px;pointer-events:auto}
#banner{position:absolute;left:50%;top:5%;transform:translateX(-50%);font-family:var(--kfont);font-size:clamp(34px,7vw,76px);color:#ffd84a;-webkit-text-stroke:8px #fff;paint-order:stroke fill;text-shadow:0 6px 0 #e0567a;white-space:nowrap}
#banner.pop{animation:pop .5s ease-out}
#cd{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font-family:var(--dfont);font-size:clamp(90px,20vw,200px);color:#ff6680;-webkit-text-stroke:12px #fff;paint-order:stroke fill;text-shadow:0 8px 0 #c2405e;pointer-events:none;white-space:nowrap}
#cd.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
#banner.pop{animation:popb .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes popb{0%{transform:translateX(-50%) scale(.3);opacity:0}100%{transform:translateX(-50%) scale(1);opacity:1}}

.titlebox{align-self:center;font-size:clamp(34px,6vw,54px);color:#3f8ee8;background:#fff;border:4px solid var(--pinkline);border-radius:18px;padding:4px 34px 6px;-webkit-text-stroke:2px #fff;text-shadow:0 3px 0 #bcdcff}
.win{display:flex;flex-direction:column;align-items:center}
.win .who{font-size:clamp(34px,6vw,60px);color:#fff;-webkit-text-stroke:7px var(--pink);paint-order:stroke fill;text-shadow:0 5px 0 #b9365c;max-width:92vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.win .tag{font-size:22px;color:#fff;background:var(--pink);padding:3px 16px;border-radius:999px;margin-bottom:4px}
.win img{width:clamp(110px,18vw,170px);height:auto;margin-bottom:-18px;position:relative;z-index:1;animation:hop 1s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.stump{width:clamp(120px,20vw,180px);height:70px;border-radius:50%/22px;background:linear-gradient(#e2b67a 0 30%,#b9844a 31% 100%);border:3px solid #8a5a2a;display:flex;align-items:flex-end;justify-content:center;font-family:var(--dfont);font-size:44px;color:#fff;-webkit-text-stroke:3px #8a5a2a;paint-order:stroke fill;padding-bottom:4px;box-sizing:border-box}
.ranks{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ranks li{display:flex;align-items:center;gap:6px;background:#f7fbff;border:2px solid #d8eafb;border-radius:12px;padding:4px 8px;min-width:0;font-size:18px}
.ranks li.hit{background:#fff0f4;border-color:var(--pink)}
.ranks img{width:34px;height:34px;flex:none}
.ranks .rk{font-family:var(--dfont);color:var(--pink);min-width:26px;text-align:right;font-variant-numeric:tabular-nums}
.ranks .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.note{font-size:15px;color:#e8506a;margin:10px 0 0}
.poke-toggle{position:absolute;top:10px;right:16px;z-index:6;display:inline-flex;align-items:center;gap:8px;font-size:20px;padding:8px 10px 8px 10px;border-radius:999px;border:3px solid #cfe6fb;background:#fff;color:var(--ink);box-shadow:0 3px 0 rgba(36,72,142,.15)}
.poke-toggle svg{width:32px;height:32px;flex:none}
.poke-toggle .onoff{font-family:var(--dfont);font-size:16px;min-width:44px;text-align:center;padding:3px 8px;border-radius:999px;background:#c9d3e3;color:#fff}
.poke-toggle[aria-pressed="true"] .onoff{background:#e8343c}
.poke-toggle[aria-pressed="true"]{background:#fff0f1;border-color:#e8343c;color:#c2242c;box-shadow:0 2px 0 #c2242c}
.poke-toggle[aria-pressed="false"] svg{filter:grayscale(.6);opacity:.75}
.poke-toggle:disabled{opacity:.5;cursor:default}
body.race-tab #setup{padding-top:72px}
#pokeLicense{position:absolute;left:0;right:0;bottom:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 10px;padding:6px 16px calc(6px + env(safe-area-inset-bottom, 0px));background:rgba(255,255,255,.92);border-top:2px solid var(--pinkline);font-family:system-ui,'Malgun Gothic',sans-serif;font-size:13px;color:#3b4a6b;line-height:1.4}
#pokeLicense a{color:#2468c8}
#pokeLicense button{font:inherit;border:1px solid #cfe6fb;background:#fff;border-radius:8px;padding:1px 8px;color:#3b4a6b}
#creditList{flex-basis:100%;text-align:center;font-size:12px;color:#5a6ea8}
body.poke-on .overlay{padding-bottom:64px}
body.poke-on #hudBtns{bottom:52px}
@media (max-width:560px){.pill{font-size:24px;padding:8px 30px 10px}.guide{font-size:17px}.logo span{display:none}}
@media (prefers-reduced-motion:reduce){#cd.pop,#banner.pop,.win img{animation:none}}
</style>

<div id="app">
  <header class="topbar">
    <div class="logo"><i aria-hidden="true"></i><span>운동회 추첨</span></div>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-race" data-tab="race">동물 달리기</button>
      <button class="tab" role="tab" id="tab-marble" data-tab="marble">마블 룰렛</button>
    </nav>
    <button class="ibtn" id="sndBtn" aria-pressed="true">소리 켬</button>
    <button class="ibtn" id="fsBtn">전체화면</button>
  </header>
  <main id="stage">
    <canvas id="cv"></canvas>
    <div id="hud">
      <div id="ticker" hidden></div>
      <div id="banner" hidden></div>
      <div id="cd" hidden></div>
      <div id="hudBtns" hidden>
        <button class="pill white sm" id="ffBtn">빠르게 ×2</button>
        <button class="pill white sm" id="stopBtn">그만하기</button>
      </div>
    </div>

    <section id="setup" class="overlay">
      <div class="panel">
        <p class="guide" id="guide"></p>
        <div class="nums" id="nums"></div>
        <label class="lbl" for="names">참가자 이름 · 한 줄에 한 명 (쉼표로 구분해도 돼요, 최대 30명)</label>
        <textarea id="names" spellcheck="false"></textarea>
        <div class="row">
          <span>당첨은</span>
          <div class="seg" id="pickSeg">
            <button data-pick="first" id="pick-first">1등</button>
            <button data-pick="last" id="pick-last">꼴등</button>
          </div>
          <span class="count" id="count"></span>
        </div>
        <p class="note" id="charNote" hidden></p>
        <p class="err" id="err" hidden></p>
      </div>
      <button class="pill" id="goBtn">달리기</button>
    </section>

    <section id="result" class="overlay" hidden>
      <div class="titlebox">순위</div>
      <div class="win">
        <span class="tag" id="winTag">1등 당첨!</span>
        <img id="winImg" alt="">
        <div class="stump" id="winRank">1</div>
        <div class="who" id="winName"></div>
      </div>
      <div class="panel"><ol class="ranks" id="rankList"></ol></div>
      <div class="btns">
        <button class="pill pink" id="againBtn">다시하기</button>
        <button class="pill" id="removeBtn">당첨자 빼고 다시</button>
        <button class="pill white" id="homeBtn">이름 바꾸기</button>
      </div>
    </section>

    <button id="pokeToggle" class="poke-toggle" aria-pressed="false" hidden>
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <circle cx="12" cy="12" r="10.5" fill="#fff" stroke="#222" stroke-width="1.6"/>
        <path d="M1.5 12a10.5 10.5 0 0 1 21 0z" fill="#e8343c" stroke="#222" stroke-width="1.6"/>
        <path d="M1.5 12h21" stroke="#222" stroke-width="1.8"/>
        <circle cx="12" cy="12" r="3.6" fill="#fff" stroke="#222" stroke-width="1.6"/>
        <circle cx="12" cy="12" r="1.5" fill="#fff" stroke="#9aa" stroke-width=".8"/>
      </svg>
      <span>포켓몬 모드</span>
      <span class="onoff" id="pokeOnOff">OFF</span>
    </button>

    <footer id="pokeLicense" hidden>
      <span>포켓몬 스프라이트: <a href="https://sprites.pmdcollab.org/" target="_blank" rel="noopener">PMD Sprite Repository (SpriteCollab)</a></span>
      <span>라이선스: <a href="https://creativecommons.org/licenses/by-nc/4.0/deed.ko" target="_blank" rel="noopener">CC BY-NC 4.0</a> · 비영리 교육용</span>
      <button id="creditBtn" aria-expanded="false">제작자 보기</button>
      <span id="creditList" hidden></span>
    </footer>
  </main>
</div>

<script src="characters.js"></script>
<script src="pokemon.js"></script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const cv = $('#cv');
let g = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;

/* ---------- 공정한 난수 ---------- */
const rnd = () => crypto.getRandomValues(new Uint32Array(1))[0] / 4294967296;
const rr = (a, b) => a + (b - a) * rnd();
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const ease = u => 1 - Math.pow(1 - u, 3);

/* ---------- 저장 ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem('animalrace.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('animalrace.' + k, JSON.stringify(v)); } catch (e) {} }
};

/* ---------- 소리 (WebAudio 합성) ---------- */
const Snd = {
  ctx: null, on: store.get('sound', true), bt: 0, lastTick: 0,
  init() {
    if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },
  tone(f, d, type = 'square', v = 0.12, when = 0, slide = 0) {
    if (!this.on || !this.ctx) return;
    const c = this.ctx, t = c.currentTime + Math.max(0, when);
    const o = c.createOscillator(), gn = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + d);
    gn.gain.setValueAtTime(v, t); gn.gain.exponentialRampToValueAtTime(0.001, t + d);
    o.connect(gn).connect(c.destination); o.start(t); o.stop(t + d + 0.03);
  },
  noise(d, v = 0.2, when = 0, f = 1500, q = 0.8) {
    if (!this.on || !this.ctx) return;
    const c = this.ctx, t = c.currentTime + when, len = Math.floor(c.sampleRate * d);
    const b = c.createBuffer(1, len, c.sampleRate), a = b.getChannelData(0);
    for (let i = 0; i < len; i++) a[i] = Math.random() * 2 - 1;
    const s = c.createBufferSource(); s.buffer = b;
    const fl = c.createBiquadFilter(); fl.type = 'bandpass'; fl.frequency.value = f; fl.Q.value = q;
    const gn = c.createGain(); gn.gain.setValueAtTime(0.001, t); gn.gain.linearRampToValueAtTime(v, t + Math.min(0.15, d / 4)); gn.gain.exponentialRampToValueAtTime(0.001, t + d);
    s.connect(fl).connect(gn).connect(c.destination); s.start(t);
  },
  beep() { this.tone(660, 0.2, 'square', 0.12); },
  go() { this.tone(990, 0.5, 'square', 0.14); this.tone(1480, 0.35, 'sine', 0.12, 0.05, 2400); this.noise(0.25, 0.25, 0, 3000, 0.6); },
  ding(rank) { const f = rank === 1 ? 1318 : 880; this.tone(f, 0.25, 'triangle', 0.16); this.tone(f * 1.5, 0.3, 'triangle', 0.1, 0.08); },
  fanfare() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.22, 'square', 0.09, i * 0.12)); [523, 659, 784, 1047].forEach(f => this.tone(f, 0.9, 'triangle', 0.08, 0.5)); this.noise(1.8, 0.22, 0.3, 1100, 0.4); },
  roll() { this.noise(0.07, 0.12, 0, 2200, 1.5); },
  tick(v) { const now = performance.now(); if (now - this.lastTick < 35) return; this.lastTick = now; this.tone(1800 + Math.random() * 1200, 0.03, 'sine', Math.min(0.06, v / 9000)); },
  boing() { this.tone(300, 0.25, 'sine', 0.12, 0, 900); },
  oops() { this.tone(500, 0.35, 'sawtooth', 0.06, 0, 160); },
  zzz() { this.tone(220, 0.5, 'sine', 0.07, 0, 180); },
  zoom() { this.tone(400, 0.35, 'square', 0.06, 0, 1600); },
  evolve() { [523, 659, 784, 988, 1047, 1319].forEach((f, i) => this.tone(f, 0.18, 'triangle', 0.09, i * 0.11)); this.tone(300, 1.0, 'sine', 0.06, 0, 1200); this.noise(1.2, 0.08, 0.2, 4000, 2); this.tone(1568, 0.6, 'square', 0.06, 0.75); },
  gate() { this.tone(200, 0.3, 'square', 0.1, 0, 90); this.noise(0.3, 0.2, 0, 600, 0.7); },
  bgm(on) {
    clearInterval(this.bt); this.bt = 0;
    if (!on || !this.ctx) return;
    const MEL = [0, 4, 7, 12, 7, 4, 7, 4, 5, 9, 12, 9, 7, 4, 2, null, 0, 4, 7, 12, 14, 12, 9, 7, 5, 4, 2, 4, 0, null, 0, null];
    const BASS = [0, 7, 5, 7, 0, 7, 5, 0];
    let step = 0, next = this.ctx.currentTime + 0.05; const spb = 0.16;
    this.bt = setInterval(() => {
      const c = this.ctx; if (!c) return;
      if (next < c.currentTime) next = c.currentTime + 0.02;
      while (next < c.currentTime + 0.25) {
        const n = MEL[step % MEL.length], w = next - c.currentTime;
        if (n != null) this.tone(523.25 * Math.pow(2, n / 12), spb * 0.85, 'square', 0.03, w);
        if (step % 2 === 0) this.tone(130.81 * Math.pow(2, BASS[(step >> 1) % BASS.length] / 12), spb * 1.7, 'triangle', 0.08, w);
        next += spb; step++;
      }
    }, 60);
  }
};

/* ---------- 캐릭터 (디자인 코드는 characters.js) ---------- */
const { ANIMALS, BALLOON, ell, tri, star, balloon, outlined, drawAnimal, marbleCol, drawMarble } = window.Chars;
Chars.setContext(g);
function nameTag(txt, x, y, maxW, size) {
  g.font = `${size}px Jua, 'Malgun Gothic', sans-serif`;
  let t = txt, w = g.measureText(t).width;
  while (w > maxW - size * 0.6 && t.length > 1) { t = t.slice(0, -1); w = g.measureText(t + '…').width; if (w <= maxW - size * 0.6) { t += '…'; break; } }
  w = g.measureText(t).width;
  const pw = w + size * 0.7, ph = size * 1.3;
  g.fillStyle = 'rgba(255,255,255,.95)'; g.strokeStyle = '#f7a8bc'; g.lineWidth = Math.max(1.5, size * 0.12);
  g.beginPath(); g.roundRect(x - pw / 2, y, pw, ph, ph / 2); g.fill(); g.stroke();
  g.fillStyle = '#24488e'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(t, x, y + ph / 2 + size * 0.05); g.textBaseline = 'alphabetic';
}
function sprite(drawFn, size = 180) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const old = Chars.getContext(); Chars.setContext(c.getContext('2d'));

/* ---------- 색종이 ---------- */
let conf = [];
function burst(x, y, n) {
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) n = Math.min(n, 20);
  for (let i = 0; i < n; i++) { const a = rnd() * Math.PI * 2, v = rr(250, 700); conf.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 300, r: rnd() * 6, vr: rr(-8, 8), c: FLAGS[i % FLAGS.length] === '#ffffff' ? '#ffd84a' : FLAGS[i % FLAGS.length], life: rr(2, 3.5), w: rr(6, 12) }); }
}
function drawConf(dt) {
  conf = conf.filter(p => (p.life -= dt) > 0 && p.y < H + 40);
  for (const p of conf) { p.vy += 700 * dt; p.vx *= 0.99; p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt; g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.fillStyle = p.c; g.fillRect(-p.w / 2, -p.w / 4, p.w, p.w / 2); g.restore(); }
}

/* ---------- 화면 흐름 ---------- */
const state = { tab: store.get('tab', 'race') === 'marble' ? 'marble' : 'race', pick: store.get('pick', 'first') === 'last' ? 'last' : 'first', chars: store.get('chars', 'animal') === 'pokemon' ? 'pokemon' : 'animal', speed: 1, playing: false };
let clock = 0, runToken = 0, cdTimer = 0, lastNames = [];
const elNames = $('#names');
elNames.value = store.get('names', '1번\n2번\n3번\n4번\n5번\n6번\n7번\n8번');
function getNames() { return elNames.value.split(/[\n,]/).map(s => s.trim()).filter(Boolean).slice(0, 30); }
const game = () => state.tab === 'race' ? Race : Marble;

function renderSetup() {
  const isRace = state.tab === 'race';
  $('#guide').innerHTML = isRace
    ? '마우스를 클릭하여 참가자 수를 고르거나 이름을 적어 주세요.<br>준비됐으면 <b>달리기</b> 버튼을 눌러 주세요. 그럼 경기가 시작됩니다. 고고씽~!'
    : '이름이 적힌 구슬들이 꼬불꼬불 코스를 굴러 내려가요.<br>준비됐으면 <b>굴리기</b> 버튼을 눌러 주세요. 어느 구슬이 먼저 도착할까요?';
  $('#goBtn').textContent = isRace ? '달리기' : '굴리기';
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === state.tab)));
  document.querySelectorAll('#pickSeg button').forEach(b => b.classList.toggle('on', b.dataset.pick === state.pick));
  const n = getNames().length, poke = isRace && state.chars === 'pokemon';
  $('#count').textContent = `${n}명 참가`;
  const note = !poke ? '' : pokeErr ? pokeErr : !(window.Poke && Poke.ready) ? '포켓몬 불러오는 중…' : '';
  $('#charNote').hidden = !note; $('#charNote').textContent = note;
  $('#goBtn').disabled = poke && !(window.Poke && Poke.ready);
  updateLicense();
  document.querySelectorAll('.num').forEach(b => b.classList.toggle('on', Number(b.dataset.n) === n && elNames.value.trim().split(/\n/).every((s, i) => s.trim() === `${i + 1}번`)));
}
const NUMS = [2, 3, 4, 5, 6, 7, 8, 10, 15, 20, 25, 30];
$('#nums').innerHTML = NUMS.map(n => `<button class="num" data-n="${n}" id="num-${n}">${n}</button>`).join('');
$('#nums').addEventListener('click', e => { const b = e.target.closest('.num'); if (!b) return; Snd.init(); Snd.tone(880, 0.08, 'square', 0.08); elNames.value = Array.from({ length: Number(b.dataset.n) }, (_, i) => `${i + 1}번`).join('\n'); onNamesChanged(); });
let prevT = 0;
function onNamesChanged() { store.set('names', elNames.value); $('#err').hidden = true; if (state.chars === 'pokemon' && window.Poke && Poke.ready) rollPoke(); renderSetup(); clearTimeout(prevT); if (state.tab === 'marble' && !state.playing) prevT = setTimeout(() => Marble.setup(getNames(), true), 250); }
elNames.addEventListener('input', onNamesChanged);
$('#pickSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; state.pick = b.dataset.pick; store.set('pick', state.pick); renderSetup(); });
// 포켓몬 모드: 고르면 그때 데이터를 불러오고, 달릴 포켓몬을 무작위로 뽑아 둠
let pokeErr = '';
function ensurePoke() {
  if (state.chars !== 'pokemon' || !window.Poke) return;
  if (Poke.ready) { if (!Race.pokeIds) rollPoke(); return; }
  Poke.load().then(() => { pokeErr = ''; rollPoke(); renderSetup(); }).catch(() => { pokeErr = '포켓몬 데이터를 불러오지 못했어요. 동물로 달려요.'; state.chars = 'animal'; renderSetup(); });
}
$('#pokeToggle').addEventListener('click', () => {
  if (state.playing) return;
  Snd.init(); Snd.tone(state.chars === 'pokemon' ? 520 : 880, 0.08, 'square', 0.08);
  state.chars = state.chars === 'pokemon' ? 'animal' : 'pokemon'; store.set('chars', state.chars); pokeErr = '';
  ensurePoke(); renderSetup();
});
// 포켓몬 모드 표기는 화면 하단에 (동물 달리기 탭에서 포켓몬 모드일 때)
function updateLicense() {
  const race = state.tab === 'race', on = race && state.chars === 'pokemon', t = $('#pokeToggle');
  $('#pokeLicense').hidden = !on; document.body.classList.toggle('poke-on', on); document.body.classList.toggle('race-tab', race);
  t.hidden = !race || state.playing; t.setAttribute('aria-pressed', String(on)); t.disabled = state.playing; $('#pokeOnOff').textContent = on ? 'ON' : 'OFF'; // 경주 중에는 숨겨 오른쪽 위 레인 표시를 가리지 않게
  t.title = on ? '포켓몬 모드 끄기' : '포켓몬 모드 켜기';
}
$('#creditBtn').addEventListener('click', () => {
  const el = $('#creditList'), open = el.hidden;
  if (open) el.textContent = '스프라이트 제작: ' + (window.Poke && Poke.ready ? Poke.credits().join(', ') : 'PMD Sprite Repository 기여자');
  el.hidden = !open; $('#creditBtn').setAttribute('aria-expanded', String(open)); $('#creditBtn').textContent = open ? '닫기' : '제작자 보기';
});

document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => { if (state.tab === b.dataset.tab && !state.playing && $('#result').hidden) return; state.tab = b.dataset.tab; store.set('tab', state.tab); toSetup(); }));

function toSetup() {
  abort();
  $('#result').hidden = true; $('#setup').hidden = false;
  Race.phase = 'idle';
  if (state.tab === 'marble') Marble.setup(getNames(), true);
  ensurePoke();
  renderSetup();
}
function abort() {
  runToken++; clearTimeout(cdTimer); state.playing = false; state.speed = 1;
  Snd.bgm(false); $('#cd').hidden = true; $('#hudBtns').hidden = true; $('#ticker').hidden = true; bannerHold = 0; setBanner('');
  $('#ffBtn').textContent = '빠르게 ×2';
}
function start(names) {
  Snd.init();
  if (state.tab === 'race' && state.chars === 'pokemon' && !(window.Poke && Poke.ready)) return;
  if (names.length < 2) { $('#err').textContent = '참가자가 2명 이상 있어야 시작할 수 있어요. 숫자 버튼을 누르거나 이름을 더 적어 주세요.'; $('#err').hidden = false; $('#setup').hidden = false; $('#result').hidden = true; return; }
  abort(); lastNames = names; conf = [];
  $('#setup').hidden = true; $('#result').hidden = true;
  state.playing = true; updateLicense();
  game().setup(names, false);
  $('#hudBtns').hidden = false; $('#ticker').hidden = true;
  const tok = runToken, el = $('#cd'), seq = ['3', '2', '1', 'START!']; let i = 0;
  const tick = () => {
    if (tok !== runToken) return;
    el.hidden = false; el.textContent = seq[i]; el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
    if (i < 3) Snd.beep(); else Snd.go();
    i++;
    if (i < seq.length) cdTimer = setTimeout(tick, 850);
    else { game().go(); $('#ticker').hidden = false; cdTimer = setTimeout(() => { if (tok === runToken) el.hidden = true; }, 700); }
  };
  cdTimer = setTimeout(tick, 400);
}
$('#goBtn').addEventListener('click', () => start(getNames()));
$('#stopBtn').addEventListener('click', () => toSetup());
$('#ffBtn').addEventListener('click', () => { state.speed = state.speed === 1 ? 2 : 1; $('#ffBtn').textContent = state.speed === 1 ? '빠르게 ×2' : '보통 속도'; });

let lastResult = null;
function finishGame(list) {
  state.playing = false; $('#hudBtns').hidden = true; $('#ticker').hidden = true; bannerHold = 0; setBanner(''); updateLicense();
  const win = state.pick === 'first' ? list[0] : list[list.length - 1];
  lastResult = win;
  $('#winTag').textContent = state.pick === 'first' ? '1등 당첨!' : '꼴등 당첨!';
  $('#winImg').src = win.img; $('#winImg').alt = win.name;
  $('#winRank').textContent = String(win.rank);
  $('#winName').textContent = win.name;
  $('#rankList').innerHTML = '';
  for (const it of list) {
    const li = document.createElement('li'); if (it === win) li.className = 'hit';
    const rk = document.createElement('span'); rk.className = 'rk'; rk.textContent = it.rank;
    const im = document.createElement('img'); im.src = it.img; im.alt = '';
    const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = it.name;
    li.append(rk, im, nm); $('#rankList').append(li);
  }
  if (state.tab === 'race') { Race.phase = 'idle'; if (state.chars === 'pokemon' && window.Poke && Poke.ready) rollPoke(); }
  $('#result').hidden = false; $('#result').scrollTop = 0;
  Snd.fanfare(); burst(W * 0.3, H * 0.4, 70); burst(W * 0.7, H * 0.4, 70);
}
$('#againBtn').addEventListener('click', () => start(lastNames));
$('#homeBtn').addEventListener('click', () => toSetup());
$('#removeBtn').addEventListener('click', () => {
  if (!lastResult) return;
  const names = lastNames.slice(), i = names.indexOf(lastResult.name); if (i >= 0) names.splice(i, 1);
  const all = elNames.value.split('\n'); const j = all.findIndex(s => s.trim() === lastResult.name);
  if (j >= 0) { all.splice(j, 1); elNames.value = all.join('\n'); store.set('names', elNames.value); }
  if (names.length < 2) { toSetup(); $('#err').textContent = '남은 참가자가 1명이라 더 뽑을 수 없어요. 이름을 다시 적어 주세요.'; $('#err').hidden = false; return; }
  start(names);
});

let tickT = 0;
function tickerUpdate(names) {
  if (clock < tickT) return; tickT = clock + 0.2;
  const el = $('#ticker'); el.hidden = state.tab === 'marble' && Marble.layout().wide; el.textContent = '';
  const t = document.createElement('div'); t.className = 'tt'; t.textContent = '실시간 순위'; el.append(t);
  names.slice(0, 3).forEach((n, i) => { const d = document.createElement('div'); const b = document.createElement('b'); b.textContent = `${i + 1}위 `; d.append(b, document.createTextNode(n)); el.append(d); });
}
let bannerTxt = '';
function setBanner(txt, pop) {
  const el = $('#banner');
  if (txt === '' && bannerHold > clock) return;
  if (pop) bannerHold = clock + 2.2;
  if (txt === bannerTxt) return; bannerTxt = txt;
  el.hidden = !txt; el.textContent = txt;
  if (txt) { el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
}
let bannerHold = 0;

$('#sndBtn').addEventListener('click', () => { Snd.on = !Snd.on; store.set('sound', Snd.on); Snd.init(); $('#sndBtn').setAttribute('aria-pressed', String(Snd.on)); $('#sndBtn').textContent = Snd.on ? '소리 켬' : '소리 끔'; if (!Snd.on) Snd.bgm(false); else if (state.playing) Snd.bgm(true); });
$('#sndBtn').setAttribute('aria-pressed', String(Snd.on)); $('#sndBtn').textContent = Snd.on ? '소리 켬' : '소리 끔';
$('#fsBtn').addEventListener('click', () => { try { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {}); } catch (e) {} });

/* ---------- 루프 ---------- */
function resize() {
  const r = $('#stage').getBoundingClientRect(); DPR = Math.min(2, window.devicePixelRatio || 1);
  W = Math.max(1, r.width); H = Math.max(1, r.height); cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
}
window.addEventListener('resize', resize);
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; clock += dt;
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  const gm = game(); gm.update(dt); gm.draw();
  drawConf(dt);
  requestAnimationFrame(frame);
}
resize(); toSetup();
requestAnimationFrame(frame);
window.__race = { Race, Marble, state };
})();
</script>

</body>
</html>
